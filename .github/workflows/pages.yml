# Build presentasi dengan Bun lalu publikasikan ke GitHub Pages setiap push ke master.
# Aktifkan sekali di GitHub: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Cek tipe, tes, build
        run: |
          bun run check
          bun test
          bun run build

      - name: Kumpulkan file situs
        run: |
          mkdir _site
          cp -r index.html assets _site/
          touch _site/.nojekyll
          if [ -f media/wawancara.mp4 ]; then mkdir -p _site/media && cp media/wawancara.mp4 _site/media/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
